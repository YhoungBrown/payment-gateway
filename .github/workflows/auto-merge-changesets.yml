name: Auto-merge Version Packages PR

on:
   workflow_run:
    workflows: ["Release"]
    types:
      - completed

jobs:
  auto-merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and merge Version Packages PR
        run: |
          PR=$(gh pr list --state open --head changeset-release/master --json number,url --jq '.[0].url')
          if [ -n "$PR" ]; then
            echo "Merging $PR"
            gh pr merge --merge --delete-branch "$PR"
          else
            echo "No Version Packages PR found - nothing to merge."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
